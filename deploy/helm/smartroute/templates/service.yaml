apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "smartroute.labels" . | nindent 4 }}
spec:
  selector: {{- include "smartroute.selector" (dict "Release" .Release "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
